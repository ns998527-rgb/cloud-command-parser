# OPTIONAL and NOT used for the submitted run: an Ollama server inside the cluster (needs about 3 GiB of RAM,
# more than the 3.65 GiB k3d node can spare next to the application). Workers would then use
# OLLAMA_URL=http://ollama.pipeline.svc.cluster.local:11434.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.5.4
          ports:
            - {containerPort: 11434}
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: "30m"}
          resources:
            requests: {cpu: "1", memory: 3Gi}
            limits: {cpu: "3", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /api/tags, port: 11434}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: pipeline
spec:
  selector: {app: ollama}
  ports:
    - {port: 11434, targetPort: 11434}
---
